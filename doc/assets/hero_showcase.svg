<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" />

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-opacity="0.2" stroke-width="1">
    <path d="M0,68 H1200 M0,136 H1200 M0,204 H1200 M0,272 H1200 M0,340 H1200 M0,408 H1200 M0,476 H1200 M0,544 H1200 M0,612 H1200" />
    <path d="M68,0 V680 M136,0 V680 M204,0 V680 M272,0 V680 M340,0 V680 M408,0 V680 M476,0 V680 M544,0 V680 M612,0 V680 M680,0 V680 M748,0 V680 M816,0 V680 M884,0 V680 M952,0 V680 M1020,0 V680 M1088,0 V680 M1156,0 V680" />
  </g>

  <circle cx="240" cy="220" r="220" fill="#10B981" opacity="0.06" />
  <circle cx="950" cy="420" r="240" fill="#06B6D4" opacity="0.05" />

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="44" height="44" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.5" />
    <circle cx="15" cy="22" r="5" fill="#10B981" />
    <line x1="20" y1="22" x2="29" y2="22" stroke="#10B981" stroke-width="2" />
    <circle cx="29" cy="22" r="3" fill="#10B981" />

    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#F8FAFC">
      smart_step_indicator
    </text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">
      Turnkey Live Order Tracking • Sub-Checkpoints • KYC Action Buttons • Overflow-Proof Steppers
    </text>

    <g transform="translate(940, 6)">
      <rect width="130" height="30" rx="15" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.2" />
      <text x="65" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#34D399">v1.2.0 READY</text>
    </g>
  </g>

  <!-- LEFT CARD: LIVE E-COMMERCE ORDER TRACKING TIMELINE -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <rect width="560" height="520" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />

    <!-- Top ETA Card -->
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981" letter-spacing="0.5">ORDER #DEL-849201</text>
      <text x="0" y="40" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">Estimated Delivery Today by 8:30 PM</text>
      <text x="0" y="58" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Courier: Express Surface Freight • Out with Driver</text>

      <g transform="translate(430, 4)">
        <rect width="68" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1" />
        <circle cx="16" cy="13" r="4" fill="#10B981" />
        <text x="38" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#34D399">LIVE</text>
      </g>
    </g>

    <line x1="24" y1="95" x2="536" y2="95" stroke="#1F2937" />

    <!-- Vertical Timeline with Sub-Events -->
    <g transform="translate(24, 115)">
      <!-- Milestone 1: Completed -->
      <g transform="translate(0, 0)">
        <circle cx="13" cy="13" r="13" fill="#10B981" />
        <path d="M9 13 L12 16 L17 10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
        <line x1="13" y1="26" x2="13" y2="60" stroke="#10B981" stroke-width="2.5" />
        
        <text x="36" y="15" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Order Placed &amp; Confirmed</text>
        <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Seller processed payment &amp; packed goods</text>
      </g>

      <!-- Milestone 2: Dispatched with SUB-CHECKPOINTS -->
      <g transform="translate(0, 60)">
        <circle cx="13" cy="13" r="13" fill="#10B981" />
        <path d="M9 13 L12 16 L17 10" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
        <line x1="13" y1="26" x2="13" y2="185" stroke="#10B981" stroke-width="2.5" />

        <text x="36" y="15" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Dispatched &amp; In-Transit</text>
        <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Package moving through distribution line</text>

        <!-- Sub-events container -->
        <g transform="translate(36, 42)">
          <rect width="455" height="100" rx="10" fill="#030712" stroke="#1F2937" />
          
          <circle cx="16" cy="22" r="3.5" fill="#10B981" />
          <text x="28" y="24" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Departed Bhiwandi Sorting Facility</text>
          <text x="440" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">Nov 17, 08:30 AM</text>

          <circle cx="16" cy="52" r="3.5" fill="#10B981" />
          <text x="28" y="54" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Arrived at Bengaluru Central Logistics Hub</text>
          <text x="440" y="54" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">Nov 17, 02:45 PM</text>

          <circle cx="16" cy="82" r="3.5" fill="#10B981" />
          <text x="28" y="84" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">Sorted &amp; Dispatched to Indiranagar Center</text>
          <text x="440" y="84" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">Nov 17, 05:10 PM</text>
        </g>
      </g>

      <!-- Milestone 3: ACTIVE OUT FOR DELIVERY -->
      <g transform="translate(0, 245)">
        <circle cx="13" cy="13" r="16" fill="#10B981" fill-opacity="0.2" />
        <circle cx="13" cy="13" r="12" fill="#0B132B" stroke="#10B981" stroke-width="2.5" />
        <circle cx="13" cy="13" r="5" fill="#10B981" />
        <line x1="13" y1="26" x2="13" y2="80" stroke="#334155" stroke-width="2.5" stroke-dasharray="4,4" />

        <text x="36" y="15" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34D399">Out for Delivery</text>
        <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Driver Rajesh K. is 1.8 km away in your area</text>
        
        <rect x="360" y="2" width="90" height="22" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
        <text x="405" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34D399">18 mins left</text>
      </g>

      <!-- Milestone 4: Pending -->
      <g transform="translate(0, 325)">
        <circle cx="13" cy="13" r="12" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
        <circle cx="13" cy="13" r="3" fill="#64748B" />

        <text x="36" y="15" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B">Delivered to Doorstep</text>
        <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">OTP handover verification required</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: FINTECH KYC TIMELINE & OVERFLOW STEPPER -->
  <g transform="translate(650, 115)">
    <!-- KYC TIMELINE CARD WITH ACTION REQUIRED BUTTON -->
    <g filter="url(#shadow)">
      <rect width="490" height="280" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="0.8">FINTECH KYC ONBOARDING PIPELINE</text>

      <!-- Step 1: Aadhaar (Done) -->
      <g transform="translate(24, 52)">
        <circle cx="12" cy="12" r="12" fill="#10B981" />
        <path d="M8 12 L11 15 L16 9" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <line x1="12" y1="24" x2="12" y2="52" stroke="#10B981" stroke-width="2" />
        <text x="34" y="16" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">1. Aadhaar e-KYC Verification</text>
        <text x="34" y="32" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94A3B8">Instant OTP authentication verified</text>
      </g>

      <!-- Step 2: PAN Card (ACTION REQUIRED) -->
      <g transform="translate(24, 104)">
        <circle cx="12" cy="12" r="12" fill="#EF4444" />
        <text x="12" y="16.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">!</text>
        <line x1="12" y1="24" x2="12" y2="82" stroke="#334155" stroke-width="2" />

        <text x="34" y="15" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#F87171">2. PAN Card Validation (Action Required)</text>
        <text x="34" y="30" font-family="-apple-system, sans-serif" font-size="10.5" fill="#EF4444">Photo blurry • Auto OCR failed name match</text>

        <!-- Re-upload CTA Button -->
        <g transform="translate(34, 38)">
          <rect width="180" height="28" rx="6" fill="#EF4444" />
          <text x="90" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">📷 Re-upload Clear Photo</text>
        </g>
      </g>

      <!-- Step 3: Bank Penny Drop (In Review) -->
      <g transform="translate(24, 186)">
        <circle cx="12" cy="12" r="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
        <text x="12" y="16" text-anchor="middle" font-size="11" fill="#F59E0B">⏳</text>
        <line x1="12" y1="24" x2="12" y2="48" stroke="#334155" stroke-width="2" />

        <text x="34" y="16" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#FBBF24">3. Bank Account Penny Drop</text>
        <text x="34" y="32" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94A3B8">Processing IMPS ₹1.00 deposit check</text>
      </g>
    </g>

    <!-- CARD 2: AUTO-COLLAPSE OVERFLOW PREVENTION -->
    <g transform="translate(0, 305)" filter="url(#shadow)">
      <rect width="490" height="215" rx="20" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1.5" />
      <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.8">OVERFLOW-PROOF RESPONSIVE STEPPER</text>
      <text x="24" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Labels auto-collapse to fit small screens with zero yellow stripes</text>

      <!-- Horizontal Stepper Sample -->
      <g transform="translate(34, 85)">
        <circle cx="20" cy="16" r="14" fill="#10B981" />
        <path d="M16 16 L19 19 L24 13" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="20" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#10B981">Cart</text>

        <line x1="40" y1="16" x2="110" y2="16" stroke="#10B981" stroke-width="2.5" />

        <circle cx="130" cy="16" r="14" fill="#10B981" />
        <path d="M126 16 L129 19 L134 13" stroke="#FFFFFF" stroke-width="2" fill="none" />
        <text x="130" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#10B981">Address</text>

        <line x1="150" y1="16" x2="220" y2="16" stroke="#38BDF8" stroke-width="2.5" />

        <circle cx="240" cy="16" r="16" fill="#38BDF8" fill-opacity="0.2" />
        <circle cx="240" cy="16" r="12" fill="#0B132B" stroke="#38BDF8" stroke-width="2" />
        <circle cx="240" cy="16" r="5" fill="#38BDF8" />
        <text x="240" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Payment</text>

        <line x1="260" y1="16" x2="330" y2="16" stroke="#334155" stroke-width="2" />

        <circle cx="350" cy="16" r="12" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
        <circle cx="350" cy="16" r="3" fill="#64748B" />
        <text x="350" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Done</text>
      </g>

      <!-- Pub Install Command -->
      <g transform="translate(24, 150)">
        <rect width="442" height="38" rx="8" fill="#030712" stroke="#10B981" stroke-width="1" />
        <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34D399">$ flutter pub add smart_step_indicator</text>
      </g>
    </g>
  </g>
</svg>
