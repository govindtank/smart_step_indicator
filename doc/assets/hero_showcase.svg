<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="bgGrad3" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#112220" />
      <stop offset="50%" stop-color="#081413" />
      <stop offset="100%" stop-color="#030807" />
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="stepperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Glowing Active Pulse -->
    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.8" />
    </filter>

    <!-- Completed Emerald Glow -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1200" height="640" fill="url(#bgGrad3)" rx="24" />
  <rect width="1196" height="636" x="2" y="2" fill="none" stroke="#163832" stroke-width="1.5" rx="23" stroke-dasharray="6,4" />

  <!-- Header Section -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <text y="0" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">RESPONSIVE &amp; OVERFLOW-PROOF STEPPER</text>
    <text y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">smart_step_indicator</text>
    <text y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Zero Overflow Errors on Narrow Displays • Active Ambient Pulse Rings • Horizontal &amp; Vertical Timelines
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 1: RESPONSIVE HORIZONTAL STEPPER (WIDE VS NARROW)                     -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 140)" filter="url(#stepperShadow)">
    <rect width="1040" height="150" rx="18" fill="#132320" stroke="#1E3E37" stroke-width="1.5" />
    <text x="24" y="32" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HORIZONTAL CHECKOUT WIZARD (INTERACTIVE)</text>

    <!-- The Horizontal Stepper Row -->
    <g transform="translate(80, 80)">
      <!-- Step 1: Completed -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="0" r="18" fill="#10B981" filter="url(#emeraldGlow)" />
        <path d="M14 0 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="20" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cart</text>
        <text x="20" y="46" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">2 items</text>
      </g>

      <!-- Connecting Line 1 (Completed) -->
      <line x1="42" y1="0" x2="260" y2="0" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

      <!-- Step 2: Completed -->
      <g transform="translate(280, 0)">
        <circle cx="20" cy="0" r="18" fill="#10B981" filter="url(#emeraldGlow)" />
        <path d="M14 0 l4 4 l8 -8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="20" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Shipping</text>
        <text x="20" y="46" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Home</text>
      </g>

      <!-- Connecting Line 2 (In Progress) -->
      <line x1="322" y1="0" x2="540" y2="0" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />

      <!-- Step 3: Active with Pulse Ring -->
      <g transform="translate(560, 0)">
        <!-- Breathing outer pulse ring -->
        <circle cx="20" cy="0" r="26" fill="#3B82F6" fill-opacity="0.2" />
        <circle cx="20" cy="0" r="18" fill="#3B82F6" filter="url(#glowPulse)" />
        <text x="20" y="5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
        <text x="20" y="32" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Payment</text>
        <text x="20" y="46" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Card •••• 4242</text>
      </g>

      <!-- Connecting Line 3 (Pending) -->
      <line x1="602" y1="0" x2="820" y2="0" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />

      <!-- Step 4: Pending -->
      <g transform="translate(840, 0)">
        <circle cx="20" cy="0" r="18" fill="none" stroke="#64748B" stroke-width="2" />
        <text x="20" y="5" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">4</text>
        <text x="20" y="32" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Confirmation</text>
        <text x="20" y="46" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Pending</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CARD 2: DUAL MODES COMPARISON (RESPONSIVE AUTO-COLLAPSE + VERTICAL)        -->
  <!-- ========================================================================= -->
  <g transform="translate(80, 314)" filter="url(#stepperShadow)">
    <!-- Subcard A: Auto-Collapse Comparison -->
    <g transform="translate(0, 0)">
      <rect width="500" height="196" rx="18" fill="#132320" stroke="#1E3E37" stroke-width="1.5" />
      <text x="24" y="30" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RESPONSIVE AUTO-COLLAPSE (NO STRIPED OVERFLOW)</text>

      <rect x="24" y="46" width="452" height="60" rx="10" fill="#091412" stroke="#1E3E37" stroke-width="1" />
      <text x="40" y="68" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">WIDE SCREEN (&gt; 480px):</text>
      <text x="40" y="90" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Shows Full Title + Subtitle details across all nodes</text>

      <rect x="24" y="118" width="452" height="60" rx="10" fill="#091412" stroke="#1E3E37" stroke-width="1" />
      <text x="40" y="140" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">NARROW SCREEN (&lt; 360px):</text>
      <text x="40" y="162" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Auto-collapses text into clean badge tooltips (0 bugs!)</text>
    </g>

    <!-- Subcard B: Vertical Timeline Mode -->
    <g transform="translate(540, 0)">
      <rect width="500" height="196" rx="18" fill="#132320" stroke="#1E3E37" stroke-width="1.5" />
      <text x="24" y="30" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VERTICAL DELIVERY TIMELINE MODE</text>

      <!-- Vertical Node 1 -->
      <g transform="translate(36, 54)">
        <circle cx="12" cy="12" r="10" fill="#10B981" />
        <path d="M9 12 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="12" y1="26" x2="12" y2="44" stroke="#10B981" stroke-width="2" />
        <text x="32" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Order Placed</text>
        <text x="32" y="28" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">10:14 AM • Confirmed</text>
      </g>

      <!-- Vertical Node 2 -->
      <g transform="translate(36, 100)">
        <circle cx="12" cy="12" r="10" fill="#10B981" />
        <path d="M9 12 l2 2 l4 -4" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="12" y1="26" x2="12" y2="44" stroke="#3B82F6" stroke-width="2" />
        <text x="32" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dispatched from Hub</text>
        <text x="32" y="28" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">FedEx Tracking #940011</text>
      </g>

      <!-- Vertical Node 3 -->
      <g transform="translate(36, 146)">
        <circle cx="12" cy="12" r="10" fill="#3B82F6" />
        <text x="12" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
        <text x="32" y="14" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Out for Delivery</text>
        <text x="32" y="28" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Arriving before 6:00 PM</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER PILL ROW: FEATURE HIGHLIGHTS                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(180, 544)">
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="5" fill="#34D399" />
      <text x="28" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Auto-Collapse Layout</text>
    </g>
    <g transform="translate(220, 0)">
      <circle cx="12" cy="12" r="5" fill="#34D399" />
      <text x="28" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Ambient Pulse Rings</text>
    </g>
    <g transform="translate(460, 0)">
      <circle cx="12" cy="12" r="5" fill="#34D399" />
      <text x="28" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Interactive Form Guards</text>
    </g>
    <g transform="translate(710, 0)">
      <circle cx="12" cy="12" r="5" fill="#34D399" />
      <text x="28" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Zero Dependencies</text>
    </g>
  </g>
</svg>
